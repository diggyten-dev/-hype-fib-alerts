name: Check 4H Fib Setup

on:
  schedule:
    # Runs a few minutes after every 4H candle close (UTC), so the
    # candle is fully closed on Binance before we fetch it.
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}   # lets you manually trigger a test run from the Actions tab

jobs:
  check-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run setup checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_alert_bot/check_setup.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_alert_bot/state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update alert state"
          git push
